<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #4ecca3; }
        .score-board {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        canvas {
            border: 3px solid #4ecca3;
            background-color: #162447;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.2);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>SNAKE GAME</h1>
    <div class="score-board">
        Score: <span id="score">0</span> | High Score: <span id="highScore">0</span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval;
        let gameStarted = false;

        highScoreElement.textContent = highScore;

        document.addEventListener("keydown", changeDirection);

        function main() {
            if (hasGameEnded()) {
                alert("Game Over! คะแนนของคุณคือ: " + score);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#162447";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4ecca3";
            snake.forEach((part, index) => {
                // ทำส่วนหัวให้สีต่างนิดหน่อย
                if(index === 0) ctx.fillStyle = "#239063";
                else ctx.fillStyle = "#4ecca3";
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // เมื่อกินอาหาร
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // ป้องกันไม่ให้อาหารเกิดบนตัวงู
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#e94560";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
            const W = 87, A = 65, S = 83, D = 68;

            // เริ่มเกมเมื่อกดปุ่มทิศทางครั้งแรก
            if (!gameStarted && [LEFT, UP, RIGHT, DOWN, W, A, S, D].includes(keyPressed)) {
                gameStarted = true;
                gameInterval = setInterval(main, 100);
            }

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((keyPressed === LEFT || keyPressed === A) && !goingRight) { dx = -1; dy = 0; }
            if ((keyPressed === UP || keyPressed === W) && !goingDown) { dx = 0; dy = -1; }
            if ((keyPressed === RIGHT || keyPressed === D) && !goingLeft) { dx = 1; dy = 0; }
            if ((keyPressed === DOWN || keyPressed === S) && !goingUp) { dx = 0; dy = 1; }
        }

        function hasGameEnded() {
            // ชนตัวเอง
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            // ชนกำแพง
            const hitLeft = snake[0].x < 0;
            const hitRight = snake[0].x >= tileCount;
            const hitTop = snake[0].y < 0;
            const hitBottom = snake[0].y >= tileCount;

            return hitLeft || hitRight || hitTop || hitBottom;
        }

        function resetGame() {
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameStarted = false;
            clearCanvas();
            drawSnake();
            drawFood();
        }

        // วาดเริ่มต้นก่อนกดเริ่มเกม
        drawSnake();
        drawFood();
    </script>
</body>
</html>
